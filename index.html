  <script>
    // GitHub Pages SPA: decode the path rewritten by 404.html (only when present)
    (function () {
      var s = window.location.search;
      if (s && s.indexOf('?/') === 0) {
        var q = s.slice(1).split('&').map(function (x) { return x.replace(/~and~/g, '&'); });
        var route = q.shift().slice(1);
        window.history.replaceState(null, null,
          window.location.pathname.replace(/\/$/, '') + '/' + route +
          (q.length ? '?' + q.join('&') : '') +
          window.location.hash
        );
      }
    })();
  </script>
